name: D3D12 probe compile

on:
  push:
    branches:
      - xbox-series-s-uwp
    paths:
      - 'runtime/three_ds_recomp/include/fast/backends/gfx_d3d12_probe.h'
      - 'runtime/three_ds_recomp/src/fast/backends/gfx_d3d12_probe.cpp'
      - 'runtime/three_ds_recomp/src/fast/backends/gfx_d3d12_probe_main.cpp'
      - '.github/workflows/d3d12-probe.yml'
  pull_request:
    branches:
      - xbox-series-s-uwp
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile D3D12 device probe
        shell: cmd
        run: |
          cl /nologo /std:c++20 /EHsc /W4 /I runtime/three_ds_recomp/include runtime/three_ds_recomp/src/fast/backends/gfx_d3d12_probe.cpp runtime/three_ds_recomp/src/fast/backends/gfx_d3d12_probe_main.cpp /Fe:d3d12-probe.exe /link d3d12.lib dxgi.lib
